<!DOCTYPE html>

  <head>

    <!--
      Ya no se cargan jQuery, el paquete JS de Bootstrap, easing ni
      owl.carousel. Lo unico que los necesitaba era el despliegue del menu,
      que ahora se maneja con estado de React (ver Header.tsx), y un
      js/main.js cuyas funciones apuntaban a elementos que esta aplicacion
      nunca llega a dibujar (carruseles y boton "volver arriba" heredados de
      la plantilla original). Eran unos 170 KB bloqueantes desde dos CDN.

      El kit de Font Awesome tambien se quito: duplicaba la hoja de estilos de

      cuatro iconos.

  </body>
